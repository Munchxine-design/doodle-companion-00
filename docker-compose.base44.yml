services:
  web:
    image: node:22-slim
    working_dir: /app
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    volumes:
      - ./:/app
      - node_cache:/app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install --no-audit --no-fund && npx vite dev --host 0.0.0.0 --port 3000"
    restart: unless-stopped

volumes:
  node_cache:
